; דוגמת הגדרת שלוחת API לחיפוש קולי במכלול
; החליפו את YOUR_API_KEY בטוקן API KEY שהנפקתם בימות המשיח דרך ממשק חומת האש.
; אין להשתמש כאן במספר מערכת:סיסמה.

type=api
api_link=https://YOUR-VERCEL-PROJECT.vercel.app/api/michlol
api_url_post=yes
api_log=no

; טוקן קבוע של ימות המשיח — API KEY.
; POST מונע את הכנסת הטוקן לכתובת URL של הבקשה.
api_add_0=YemotApiKey=YOUR_API_KEY

; אין צורך ב-api_000: החיפוש עצמו נאסף באמצעות read מהשרת.
